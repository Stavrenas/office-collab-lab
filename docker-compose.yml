# Office engine evaluation lab — Collabora CODE + Euro-Office.
# Ports are bound to 127.0.0.1 only. Do not publish demo endpoints.

services:
  harness:
    build:
      context: ./harness
    container_name: eval-harness
    ports:
      - "127.0.0.1:3100:3100"
    env_file:
      - .env
    environment:
      HARNESS_PORT: "3100"
      HARNESS_PUBLIC_URL: http://harness:3100
      STORAGE_ROOT: /data/storage
      CORPUS_ROOT: /data/corpus
      EVIDENCE_ROOT: /data/evidence
      NODE_ENV: production
    volumes:
      - ./storage:/data/storage
      - ./corpus:/data/corpus
      - ./evidence:/data/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - office-lab
    restart: unless-stopped

  eurooffice:
    image: ghcr.io/euro-office/documentserver:latest
    container_name: eval-eurooffice
    profiles: ["eurooffice", "all"]
    ports:
      - "127.0.0.1:8082:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${EO_JWT_SECRET}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      EXAMPLE_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    volumes:
      - eo-data:/var/www/onlyoffice/Data
      - eo-logs:/var/log/onlyoffice
    networks:
      - office-lab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  collabora:
    image: collabora/code:latest
    container_name: eval-collabora
    profiles: ["collabora", "all"]
    ports:
      - "127.0.0.1:9980:9980"
    environment:
      # aliasgroup = WOPI host (harness), not the editor hostname
      aliasgroup1: http://host.docker.internal:3100
      aliasgroup2: http://harness:3100
      username: ${COLLABORA_USERNAME}
      password: ${COLLABORA_PASSWORD}
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=false
        --o:net.proxy_prefix=false
        --o:net.content_security_policy=frame-ancestors http://localhost:3100 *;
      DONT_GEN_SSL_CERT: "true"
      server_name: localhost:9980
    cap_add:
      - MKNOD
    networks:
      - office-lab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  office-lab:
    name: office-lab

volumes:
  eo-data:
  eo-logs:
